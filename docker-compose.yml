services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    container_name: master
    ports:
      - "8000:8000"
    environment:
      - SECONDARY_URLS=${SECONDARY_URLS}
      - INITIAL_RETRY_DELAY=${INITIAL_RETRY_DELAY}
      - MAX_RETRY_DELAY=${MAX_RETRY_DELAY}
      - SECONDARY_AUTH_SECRET=${SECONDARY_AUTH_SECRET}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL}
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT}
      - HEALTHY_THRESHOLD=${HEALTHY_THRESHOLD}
      - UNHEALTHY_THRESHOLD=${UNHEALTHY_THRESHOLD}
    depends_on:
      - secondary1
      - secondary2
    volumes:
      - ./logs/master.log:/app/storage.log
    networks:
      - lognet

  secondary1:
    build:
      context: .
      dockerfile: secondary/Dockerfile
    container_name: secondary1
    ports:
      - "8003:8000"
    environment:
      - MAX_REPLICATION_DELAY=${MAX_REPLICATION_DELAY}
      - SECONDARY_AUTH_SECRET=${SECONDARY_AUTH_SECRET}
      - SECONDARY_ERROR_PROBABILITY=${SECONDARY_ERROR_PROBABILITY}
    volumes:
      - ./logs/secondary1.log:/app/storage.log
    networks:
      - lognet

  secondary2:
    build:
      context: .
      dockerfile: secondary/Dockerfile
    container_name: secondary2
    ports:
      - "8002:8000"
    environment:
      - MAX_REPLICATION_DELAY=${MAX_REPLICATION_DELAY}
      - SECONDARY_AUTH_SECRET=${SECONDARY_AUTH_SECRET}
      - SECONDARY_ERROR_PROBABILITY=${SECONDARY_ERROR_PROBABILITY}
    volumes:
      - ./logs/secondary2.log:/app/storage.log
    networks:
      - lognet

networks:
  lognet:
    driver: bridge
